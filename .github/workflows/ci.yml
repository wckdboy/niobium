name: Niobium tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ios:
        description: 'Also run the parked iOS client checks'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --prefix runtime --ignore-scripts
      - run: node --test tests/*.test.mjs
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: node tools/check-plane-sync.mjs
      - run: node site/build.mjs && node site/check.mjs
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;30.0.16248370'
          log-accepted-android-sdk-licenses: false
      - name: Schema and real WebSocket fixture tests, debug build and lint
        working-directory: android
        run: ./gradlew :core:test :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --console=plain
      - name: Verify packaged runtime integrity and native alignment
        run: python3 tools/check-android-runtime.py android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-test-evidence
          path: |
            android/app/build/reports/tests/
            android/app/build/test-results/
            android/app/build/reports/lint-results-debug.html
            core/build/**/test-results/
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare pinned native DSH bundle
        run: python3 tools/prepare-desktop-runtime.py
      - name: Shared core, desktop UI, real DSH restart and native package
        working-directory: desktop
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a ./gradlew :core:test test createDistributable packageDistributionForCurrentOS --console=plain
          else
            ./gradlew :core:test test createDistributable packageDistributionForCurrentOS --console=plain
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-${{ runner.os }}-${{ runner.arch }}
          compression-level: 0
          path: |
            desktop/build/compose/binaries/main/dmg/*.dmg
            desktop/build/compose/binaries/main/deb/*.deb
            desktop/build/reports/tests/
            desktop/build/test-results/
            desktop/build/evidence/
            core/build/**/test-results/
  ios:
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Generate client test project
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate
      - name: Select available iPhone simulator
        id: simulator
        run: |
          xcrun simctl list devices available -j > /tmp/niobium-simulators.json
          python3 -c 'import json; d=json.load(open("/tmp/niobium-simulators.json")); print("id="+next(v["udid"] for k,items in d["devices"].items() if "iOS" in k for v in items if "iPhone" in v["name"]))' >> "$GITHUB_OUTPUT"
      - name: Native unit and UI tests
        run: |
          xcodebuild -project ios/Niobium.xcodeproj -scheme Niobium \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -parallel-testing-enabled NO -resultBundlePath /tmp/NiobiumTests.xcresult \
            CODE_SIGNING_ALLOWED=NO test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-test-evidence
          path: /tmp/NiobiumTests.xcresult
